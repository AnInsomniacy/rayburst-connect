name: Publish to Stores

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.2) or 'latest' for latest production release"
        type: string
        default: latest

permissions:
  actions: write
  contents: read

jobs:
  resolve-version:
    if: vars.STORE_PUBLISHING_ENABLED == 'true'
    name: Resolve Version
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Resolve target production release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_INPUT: ${{ inputs.version }}
        run: pnpm exec tsx scripts/actions/resolve-release.ts

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: resolve-version
    outputs:
      result: ${{ steps.publish.outputs.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download published Chromium package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: gh release download "$RELEASE_TAG" --pattern "rayburst-connect-${VERSION}-chromium-mv3.zip" --dir .output

      - name: Upload and publish to Chrome Web Store
        id: publish
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: pnpm exec tsx scripts/actions/publish-chrome.ts

  publish-firefox:
    name: Publish to Firefox AMO
    needs: resolve-version
    outputs:
      result: ${{ steps.publish.outputs.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download published Firefox package and source
        env:
          RELEASE_SHA: ${{ needs.resolve-version.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "rayburst-connect-${VERSION}-firefox-mv3.zip" --dir .output
          unzip -q ".output/rayburst-connect-${VERSION}-firefox-mv3.zip" -d .output/firefox-mv3
          git fetch --depth=1 origin "$RELEASE_SHA"
          git archive --format=zip "$RELEASE_SHA" > source-code.zip

      - name: Sign and submit to AMO
        id: publish
        env:
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: pnpm exec tsx scripts/actions/publish-firefox.ts

  publish-edge:
    name: Publish to Edge Add-ons
    needs: resolve-version
    outputs:
      result: ${{ steps.publish.outputs.result }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Download published Chromium package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: gh release download "$RELEASE_TAG" --pattern "rayburst-connect-${VERSION}-chromium-mv3.zip" --dir .output

      - name: Upload and publish to Edge Add-ons
        id: publish
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO_VARIABLES_TOKEN: ${{ secrets.REPO_VARIABLES_TOKEN }}
          EDGE_LAST_OPERATION_ID: ${{ vars.EDGE_LAST_OPERATION_ID }}
          EDGE_LAST_OPERATION_VERSION: ${{ vars.EDGE_LAST_OPERATION_VERSION }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: pnpm exec tsx scripts/actions/publish-edge.ts

  summary:
    name: Summary
    needs: [resolve-version, publish-chrome, publish-firefox, publish-edge]
    if: always() && needs.resolve-version.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Write the publish summary
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
          CHROME: ${{ needs.publish-chrome.result }}
          CHROME_RESULT: ${{ needs.publish-chrome.outputs.result }}
          FIREFOX: ${{ needs.publish-firefox.result }}
          FIREFOX_RESULT: ${{ needs.publish-firefox.outputs.result }}
          EDGE: ${{ needs.publish-edge.result }}
          EDGE_RESULT: ${{ needs.publish-edge.outputs.result }}
        run: |
          # A store job that failed or did not finish leaves no result of its own.
          result() {
            case "$1" in
              success) echo "${2:-Done}" ;;
              failure) echo "Failed, see the job log" ;;
              *) echo "${1^}" ;;
            esac
          }
          {
            echo "## Publish Summary"
            echo
            echo "Release: \`$TAG\`"
            echo
            echo "| Store | Result |"
            echo "| --- | --- |"
            echo "| Chrome Web Store | $(result "$CHROME" "$CHROME_RESULT") |"
            echo "| Firefox AMO | $(result "$FIREFOX" "$FIREFOX_RESULT") |"
            echo "| Edge Add-ons | $(result "$EDGE" "$EDGE_RESULT") |"
          } >> "$GITHUB_STEP_SUMMARY"
