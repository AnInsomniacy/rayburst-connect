name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Type check
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check translations
        run: pnpm lint:i18n

      - name: Check media contract
        run: pnpm media:contract:check

      - name: Check formatting
        run: pnpm format:check
